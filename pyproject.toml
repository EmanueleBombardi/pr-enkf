[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-enkf"
version = "1.0.0"
description = "Parameter-Regularised Ensemble Kalman Filter for model-parameter inference"
readme = "README.md"
license = {text = "GPL-3.0-only"}
authors = [{name = "Emanuele Bombardi"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
tutorial = ["matplotlib", "jupyter"]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/EmanueleBombardi/pr-enkf"
Paper = "https://arxiv.org/abs/2607.03571"

[tool.setuptools.packages.find]
include = ["pr_enkf*"]
